[project]
name = "physicsveto"
version = "0.1.0"
description = "AI physics surrogate workbench with a physics veto"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["physicsveto*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["I001", "E402"]
