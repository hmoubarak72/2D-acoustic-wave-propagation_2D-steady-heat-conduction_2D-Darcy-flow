# Case A: 2D acoustic wave propagation (energy / subsurface)
case_a:
  name: "2D acoustic wave propagation"
  vertical: "Energy / subsurface (seismic imaging, FWI)"
  n: 64                 # grid cells per side
  dx: 10.0              # m
  dt: 0.0008            # s  (CFL-checked against max velocity at run time)
  nt: 252               # time steps; last anchor + 1 must be < nt
  sponge: 0             # optional sponge width (cells); Mur absorbing edges are always on
  sponge_strength: 0.0
  f0: 15.0              # Ricker peak frequency (Hz)
  t0: 0.07              # Ricker delay (s)
  # Anchor steps the surrogate predicts. Each anchor is predicted as a
  # triplet (n-1, n, n+1) so the PDE residual can be evaluated in time.
  anchors: [60, 90, 120, 150, 175, 200, 225, 250]
  # Training distribution
  v_min: 2000.0
  v_max: 3500.0
  corr_len_range: [5.0, 10.0]     # Gaussian smoothing sigma (cells)
  source_depth: 16                # row index
  source_x_range: [20, 44]        # column index range
  n_train: 1200
  n_val: 150
  n_test: 150
  seed: 7

# Case B: 2D steady heat conduction (electronics cooling, manufacturing)
#   -div(k grad T) = q,  T = 0 on the boundary (cold plate / heat sink at the edges)
case_b:
  name: "2D steady heat conduction"
  vertical: "Electronics cooling / thermal management"
  n: 64
  logk_range: 1.0            # log conductivity spans [-1, 1]  ->  k in [0.37, 2.7]
  corr_len_range: [4.0, 8.0] # Gaussian smoothing sigma (cells)
  n_sources_range: [1, 3]
  source_width_range: [2.0, 4.0]
  source_pos_range: [14, 49] # cells
  source_power_range: [50.0, 150.0]
  n_train: 1000
  n_val: 150
  n_test: 150
  seed: 11

# Case C: 2D Darcy flow (reservoir, groundwater, CCS)
#   -div(k grad p) = f,  p = 0 on the boundary,  f = 1 (uniform injection), two-phase permeability
case_c:
  name: "2D Darcy flow"
  vertical: "Reservoir / groundwater / CO2 storage"
  n: 64
  k_low: 3.0
  k_high: 12.0
  corr_len_range: [3.0, 6.0]
  threshold_range: [-0.4, 0.4]   # GRF threshold: controls the high-permeability fraction
  forcing: 1.0
  n_train: 1000
  n_val: 150
  n_test: 150
  seed: 13
