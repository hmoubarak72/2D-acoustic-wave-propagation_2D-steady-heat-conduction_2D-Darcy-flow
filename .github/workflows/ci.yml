name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: App smoke test
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          import glob
          for page in ["app/Home.py", *sorted(glob.glob("app/pages/*.py"))]:
              at = AppTest.from_file(page, default_timeout=120).run()
              assert not at.exception, (page, at.exception)
              print("ok", page)
          PY
